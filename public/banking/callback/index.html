<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vaultie — grįžtama į programėlę…</title>
  <style>
    :root { color-scheme: light; }
    /* #003DE1 is the ACTUAL brand blue (DS.brand in design_system.dart, same
       hex the website header/app icon use) — not a hand-picked shade. The
       icon below is the real app icon file (/img/icon.png), not a redrawn
       approximation, so this page can never again show a "wrong" mark. */
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #F4F6FF; color: #0B1533;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 380px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
      display: block; box-shadow: 0 8px 24px rgba(0,61,225,0.25);
    }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #4C5B7D; margin: 0 0 24px; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 20px; border-radius: 50%;
      border: 3px solid rgba(0,61,225,0.15); border-top-color: #003DE1;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn {
      display: inline-block; background: #003DE1; color: #fff; text-decoration: none;
      font-weight: 700; font-size: 15px; padding: 14px 22px; border-radius: 14px;
    }
    .hidden { display: none; }
    /* Draws the eye once we know the automatic hand-off didn't happen — a
       still spinner reads as "working", a pulsing button reads as "tap me". */
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,61,225,0.45); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(0,61,225,0); }
    }
    a.btn.pulse { animation: pulse 1.1s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/img/icon.png" alt="Vaultie">
    <div id="loading">
      <div class="spinner" id="spinner"></div>
      <h1 id="heading">Grįžtama į Vaultie…</h1>
      <p id="body">Baigiame prijungti tavo banką. Jei programėlė neatsidaro automatiškai,
         paspausk mygtuką žemiau.</p>
      <a id="open" class="btn" href="#">Atidaryti Vaultie</a>
    </div>
    <div id="error" class="hidden">
      <h1>Trūksta duomenų</h1>
      <p>Nepavyko rasti prisijungimo kodo. Grįžk į Vaultie ir bandyk dar kartą.</p>
    </div>
  </div>

  <script>
    // Universal Links / Android App Links do the real work: when Vaultie is
    // installed, the OS opens the app directly from the https redirect URL
    // and this page never renders. This page therefore only runs as a
    // FALLBACK — the app isn't installed, the OS link verification hasn't
    // been granted yet, or the link arrived through a context (e.g. a bank's
    // own app handing off) that doesn't route it directly.
    //
    // A bare `vaultie://...` href is NOT reliable on Android Chrome — not
    // even on a direct tap, which is what a "tap the button" fallback is
    // supposed to guarantee. Chrome only reliably resolves a custom scheme
    // via its own `intent://` URI form (Google's documented mechanism for a
    // webpage to hand off to a specific native app); a bare custom scheme is
    // resolved inconsistently across Chrome versions and OEM builds, which is
    // exactly why this worked for some testers and did nothing — not even on
    // tap — for others. iOS has no such gate, so it keeps the plain scheme.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');

      if (!code) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        return;
      }

      var qs = 'code=' + encodeURIComponent(code);
      if (state) qs += '&state=' + encodeURIComponent(state);

      var isAndroid = /Android/i.test(navigator.userAgent);
      // iOS keeps the plain custom scheme — ASWebAuthenticationSession has no
      // gesture gate, it just watches for the callback scheme regardless of
      // how it's triggered. Android needs the `intent://` wrapper (below):
      // Google's documented mechanism for a webpage handing off to a named
      // app by package, which resolves reliably on a real tap across Chrome
      // versions/OEM builds where the bare scheme is inconsistent.
      var btnLink = 'vaultie://banking/callback?' + qs;
      if (isAndroid) {
        // package= pins this to Vaultie specifically, skipping any app-chooser
        // prompt; S.browser_fallback_url is where Chrome sends the user if no
        // app claims the scheme (Vaultie not installed) instead of a dead end.
        var fallback = encodeURIComponent(window.location.href);
        btnLink = 'intent://banking/callback?' + qs +
          '#Intent;scheme=vaultie;package=com.kreocom.vaultie;' +
          'S.browser_fallback_url=' + fallback + ';end';
      }

      var openBtn = document.getElementById('open');
      openBtn.setAttribute('href', btnLink);

      // No automatic window.location.replace(autoLink) here — tried it, and
      // on this device Chrome didn't silently follow it. It showed Chrome's
      // OWN "Eiti toliau į vaultie?" confirmation banner instead, and once
      // that got dismissed, the tab fell back to whatever page was earlier in
      // its history (the bank's own consent screen) rather than closing —
      // confusing on top of confusing, and still needed a manual close (X)
      // to reveal the app underneath even though the connection had already
      // completed by then. Confirmed against Chrome's own public guidance: a
      // script-triggered navigation to a scheme it doesn't own is not treated
      // as a user gesture, so it is never guaranteed to hand off silently —
      // only a real tap is. The tab-not-closing half of that is fixed
      // separately (Custom Tab now launches with FLAG_ACTIVITY_NO_HISTORY —
      // see `ephemeralIntentFlags` in bank_connect_screen.dart — so there is
      // no earlier page left to fall back to once the handoff happens).
      //
      // Reaching this page at all already means Universal Links / Android App
      // Links did NOT intercept the redirect before it rendered — a bank that
      // hands off to its own separate app (SEB, Swedbank) skips this page
      // entirely. Everything that DOES render here completed its whole OAuth
      // flow inside the SAME browser tab (e.g. Revolut), so a tap on the
      // button below is the normal way this finishes, not a fallback for
      // something broken.
      setTimeout(function () {
        if (document.hidden) return; // already left — don't relabel a dead page
        document.getElementById('spinner').classList.add('hidden');
        document.getElementById('heading').textContent = 'Paspausk, kad atidarytum Vaultie';
        document.getElementById('body').textContent =
          'Automatiškai neperėjome — telefonas kartais to nepadaro pats. Vienas palietimas, ir esi programėlėje.';
        openBtn.classList.add('pulse');
      }, 500);
    })();
  </script>
</body>
</html>
